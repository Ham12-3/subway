<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lane Runner</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" class="hud">
      <div class="hud-panel hud-stats">
        <div class="stat">
          <span class="label">Score</span><span id="score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Coins</span><span id="coins" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Distance</span><span id="distance" class="value">0 m</span>
        </div>
        <div class="stat">
          <span class="label">Speed</span><span id="speed" class="value">0 m/s</span>
        </div>
      </div>
      <div class="hud-panel hud-mode">
        <span id="mode" class="mode">Human mode</span>
        <span class="keys"
          >&larr; &rarr; lanes &middot; &uarr; jump &middot; &darr; roll &middot; R restart</span
        >
        <span id="seed" class="seed"></span>
      </div>
    </div>

    <div id="gameover" class="overlay" hidden>
      <div class="overlay-card">
        <h1>Run over</h1>
        <p id="gameover-reason" class="reason"></p>
        <dl class="results">
          <div>
            <dt>Score</dt>
            <dd id="final-score">0</dd>
          </div>
          <div>
            <dt>Coins</dt>
            <dd id="final-coins">0</dd>
          </div>
          <div>
            <dt>Distance</dt>
            <dd id="final-distance">0 m</dd>
          </div>
        </dl>
        <button id="restart" type="button">Run again</button>
      </div>
    </div>

    <div id="fatal" class="overlay" hidden>
      <div class="overlay-card overlay-error">
        <h1>Something is wrong</h1>
        <pre id="fatal-message"></pre>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
